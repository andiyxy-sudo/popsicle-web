name: typecheck
# Runs the same TypeScript check Vercel runs, on every push and PR, so a
# broken bundle is caught before the deployment step.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
